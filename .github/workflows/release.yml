name: Build and publish Joomla update

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: joomla-release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build release when the manifest version is new
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' package/pkg_dharma_universal_filter.xml | head -1)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || { echo "Invalid package version: $version" >&2; exit 1; }
          tag="v$version"
          if gh release view "$tag" --json tagName >/dev/null 2>&1; then
            echo "Release $tag already exists; no new package to publish."
            exit 0
          fi

          python3 - "$version" <<'PY'
          import re
          import sys
          from pathlib import Path

          version = sys.argv[1]
          manifests = (
              Path("src/libraries/dharma_universal_filter/dharma_universal_filter.xml"),
              Path("src/modules/mod_dharma_universal_filter/mod_dharma_universal_filter.xml"),
              Path("src/plugins/system/dharma_universal_filter/dharma_universal_filter.xml"),
              Path("src/plugins/task/dharma_universal_filter/dharma_universal_filter.xml"),
          )
          for manifest in manifests:
              source = manifest.read_text(encoding="utf-8")
              source, count = re.subn(r"<version>[^<]+</version>", f"<version>{version}</version>", source, count=1)
              if count != 1:
                  raise SystemExit(f"Could not synchronize version in {manifest}")
              manifest.write_text(source, encoding="utf-8")

          package = Path("package/pkg_dharma_universal_filter.xml")
          source = package.read_text(encoding="utf-8")
          for name in (
              "lib_dharma_universal_filter",
              "mod_dharma_universal_filter",
              "plg_system_dharma_universal_filter",
              "plg_task_dharma_universal_filter",
          ):
              source, count = re.subn(rf"({re.escape(name)}_)[^<]+\.zip", rf"\g<1>{version}.zip", source, count=1)
              if count != 1:
                  raise SystemExit(f"Could not synchronize package filename for {name}")
          package.write_text(source, encoding="utf-8")
          PY

          bash build/build-package.sh "$version"
          package="dist/pkg_dharma_universal_filter_${version}.zip"
          test -f "$package"
          checksum="$(sha256sum "$package" | cut -d' ' -f1)"
          python3 - "$version" "$checksum" "$package" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          version, checksum, package = sys.argv[1:]
          root = ET.Element("updates")
          update = ET.SubElement(root, "update")
          for tag, value in (
              ("name", "Dharma Universal Filter"),
              ("description", "Dharma Universal Filter Joomla package"),
              ("element", "pkg_dharma_universal_filter"),
              ("type", "package"),
              ("version", version),
          ):
              ET.SubElement(update, tag).text = value
          downloads = ET.SubElement(update, "downloads")
          download = ET.SubElement(downloads, "downloadurl", {"type": "full", "format": "zip"})
          download.text = f"https://github.com/shivayanamahom/dharma-universal-filter/releases/download/v{version}/{package.rsplit('/', 1)[-1]}"
          ET.SubElement(update, "sha256").text = checksum
          ET.indent(root, space="\t")
          ET.ElementTree(root).write("updates.xml", encoding="utf-8", xml_declaration=True)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates.xml package/pkg_dharma_universal_filter.xml src/libraries/dharma_universal_filter/dharma_universal_filter.xml src/modules/mod_dharma_universal_filter/mod_dharma_universal_filter.xml src/plugins/system/dharma_universal_filter/dharma_universal_filter.xml src/plugins/task/dharma_universal_filter/dharma_universal_filter.xml
          if ! git diff --cached --quiet; then
            git commit -m "Publish Joomla update metadata for $tag"
            git push origin HEAD:main
          fi
          gh release create "$tag" "$package" --title "Dharma Universal Filter $version" --generate-notes
